name: "Setup Python Env"
description: "Composite action: sets up Python and installs dependencies — reused as ONE step in any job."
inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.12"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install dependencies
      shell: bash
      run: pip install -r requirements.txt
